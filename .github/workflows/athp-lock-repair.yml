name: ATHP Temporary Lock Repair

on:
  push:
    branches:
      - security/npm-audit-baseline-2026-08-10
    paths:
      - ".github/workflows/athp-lock-repair.yml"
      - "package-lock.json"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: athp-temporary-lock-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/npm-audit-baseline-2026-08-10
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Generate compatible lock-only security repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/package.before.json"
          npm audit fix --package-lock-only
          cmp package.json "$RUNNER_TEMP/package.before.json"
          mapfile -t changed < <(git diff --name-only)
          if ((${#changed[@]} == 0)); then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No lockfile repair remains to commit.'
            exit 0
          fi
          printf 'Changed files after npm audit fix --package-lock-only:\n'
          printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'package-lock.json'
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git diff --stat -- package-lock.json

      - name: Install repaired exact graph
        if: steps.repair.outputs.changed == 'true'
        run: npm ci

      - name: Build repaired graph
        if: steps.repair.outputs.changed == 'true'
        run: npm run build

      - name: Test repaired graph
        if: steps.repair.outputs.changed == 'true'
        run: npm test

      - name: Audit repaired production graph
        if: steps.repair.outputs.changed == 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Audit repaired full graph
        if: steps.repair.outputs.changed == 'true'
        run: npm audit --audit-level=high

      - name: Commit only the verified lock repair
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'athp-security-automation[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --name-only | grep -Fx 'package-lock.json'
          git commit -m 'security: refresh compatible npm lock for audited fixes'
          git push origin HEAD:security/npm-audit-baseline-2026-08-10
